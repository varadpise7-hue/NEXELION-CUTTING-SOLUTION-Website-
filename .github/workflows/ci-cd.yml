name: Production CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull your static website files into the runner environment
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Directly deploy the root directory to Netlify (no build process required)
    - name: Deploy to Netlify
      uses: netlify/actions/cli@master
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      with:
        # "." means it deploys all files from your project root (index.html, Emergent_files, etc.)
        args: deploy --dir=. --prod
